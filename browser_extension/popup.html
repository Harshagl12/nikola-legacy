<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikola Autofill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      min-height: 400px;
      background: #0a0a14;
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
    }
    
    .header {
      background: #1a1a30;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .header-title {
      font-weight: 600;
      color: #7c6af7;
      flex: 1;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    
    .status-dot.offline {
      background: #ff6b6b;
    }
    
    .content {
      padding: 12px;
    }
    
    .section {
      margin-bottom: 12px;
    }
    
    .section-title {
      font-weight: 600;
      margin-bottom: 6px;
      color: #a0a0b8;
      font-size: 11px;
      text-transform: uppercase;
    }
    
    .field-list {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .field-item {
      display: flex;
      align-items: center;
      padding: 4px;
      gap: 6px;
      margin-bottom: 4px;
    }
    
    .field-item:last-child {
      margin-bottom: 0;
    }
    
    .field-item input[type="checkbox"] {
      cursor: pointer;
    }
    
    .field-label {
      flex: 1;
      font-size: 12px;
    }
    
    .field-value {
      color: #a0a0b8;
      font-size: 11px;
    }
    
    .btn {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 6px;
    }
    
    .btn-primary {
      background: #7c6af7;
      color: white;
    }
    
    .btn-primary:hover {
      background: #6c5ce7;
    }
    
    .btn-danger {
      background: rgba(255,80,80,0.12);
      color: #ff6b6b;
      border: 1px solid rgba(255,80,80,0.25);
    }
    
    .btn-danger:hover {
      background: rgba(255,80,80,0.25);
    }
    
    .input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    
    .input-group input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e8e8f0;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: #7c6af7;
    }
    
    .offline-message {
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      color: #ff6b6b;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">Nikola Autofill</span>
    <div class="status-dot" id="status-dot"></div>
  </div>
  
  <div class="content" id="content">
    <!-- Will be populated by script -->
  <script src="popup.js"></script>
</body>
</html>
